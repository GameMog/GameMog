# Render Blueprint for GameMog (docs/DEPLOY-RENDER.md). In the Render dashboard:
# New > Blueprint > GameMog/GameMog. No secret lives in this file: the owner
# enters ADMIN_PASSWORD and ANTHROPIC_API_KEY on the service's Environment page.
# Worlds are test-driven in the creator's browser (lib/test-drive.ts): this
# server has no graphics card and runs no Chrome.
services:
  - type: web
    name: gamemog
    runtime: node
    # Standard, $25 a month: 1 CPU, 2 GB (the owner, 7 Nov, for launch; was
    # Starter 0.5c-512mb). Story worlds' files stream from the disk.
    plan: 1c-2g
    region: virginia
    # next.config.ts builds with one worker, so the build's fresh database is safe
    buildCommand: npm ci && npm run build
    # the first boot on an empty disk copies in deploy/seed.db.gz
    startCommand: node deploy/boot.mjs && node_modules/.bin/next start -p $PORT
    healthCheckPath: /robots.txt
    autoDeployTrigger: commit
    # www.gamemog.com is added and redirected here automatically. DNS is at
    # GoDaddy (docs/DEPLOY-RENDER.md); Render issues and renews the certificate.
    domains:
      - gamemog.com
    # the database and the Story Kit store (data/storykit) live here, and
    # survive deploys; 10 GB (the owner, 7 Nov; was 1 GB). The store may use
    # STORYKIT_DISK_MB of it (8,000 by default, guard at 90%). 20 GB for the
    # town builder's queue, tiles, bundles and staged sources (data/hometown,
    # docs/HOMETOWN-HOSTING.md "Production builder"): $5 a month. A disk grows,
    # never shrinks; 50 GB with region pre-staging is the owner's call.
    disk:
      name: gamemog-data
      mountPath: /opt/render/project/src/data
      sizeGB: 20
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Create and Mog it are open (the owner, 30 Sep; ANTHROPIC_API_KEY is on
      # the Environment page). "off" goes back to "Coming soon" and refuses
      # builds (middleware.ts).
      - key: NEXT_PUBLIC_BUILDS
        value: "on"
      # link previews, canonical addresses and the sitemap use the custom domain
      - key: SITE_URL
        value: https://gamemog.com
      - key: ADMIN_PASSWORD
        sync: false
      # Hometown towns served from this disk (docs/HOMETOWN-HOSTING.md, lib/hometown-tiles/): off until the owner
      # turns them on. data/hometown may use HOMETOWN_DISK_CAP_GB of the disk (2 by default; Story Kit has 8,000 MB
      # of it on paper, so a 20 GB disk is the proposal before the cap goes up), and no put lands while the disk's free
      # space is under HOMETOWN_FREE_FLOOR_GB (2). This server does not compile: towns are pre-warmed on the Mac
      # and uploaded with the owner's token.
      - key: HOMETOWN_TILES
        value: "off"
      - key: HOMETOWN_COMPILE
        value: "off"
      # the bearer token for /api/hometown/admin/* (upload, status, GC): entered by the owner on the Environment page,
      # at least 24 characters; unset, the admin routes are not found
      - key: HOMETOWN_ADMIN_TOKEN
        sync: false
      # The production town builder (lib/hometown-build, docs/HOMETOWN-HOSTING.md "Production builder"): the web holds
      # the job queue (data/hometown/queue.db) and the store, and NEVER compiles; the gamemog-town-builder workers below
      # do. off: the queue is inert and no town route answers from it. owner: every town route, and Create's town box,
      # answer only the owner's /admin session (the production test). on: players.
      - key: HOMETOWN_BUILDER
        value: "off"
      # the workers' bearer token (24+ characters), entered by the owner here once; the workers read it from this
      # service (fromService envVarKey). Unset: /api/hometown/worker is not found
      - key: HOMETOWN_WORKER_TOKEN
        sync: false
      # spawn first (compiler 0.7.0+: --frame and --assemble, pinned by the worker image): the story starts from the
      # town's frame, and players drive the 5 x 5 spawn district while the rest of the town builds
      - key: HOMETOWN_FRAME
        value: "on"
      # the build new towns are made at: the buildId the workers log at start (the owner's status page shows it)
      - key: HOMETOWN_BUILD
        sync: false
      # the store's share of the 20 GB disk (Story Kit 8 GB on paper, the 2 GB free floor), and the staged Overture
      # regions' own share of it (least recently used go first)
      - key: HOMETOWN_DISK_CAP_GB
        value: "8"
      - key: HOMETOWN_SRC_CAP_GB
        value: "2"
      # a new town is refused (busy, with the 3 nearest built towns) when its wait to drive is over this
      - key: HOMETOWN_MAX_WAIT_S
        value: "600"
      - key: HOMETOWN_PER_IP_HOUR
        value: "3"

  # The town builder (docs/HOMETOWN-HOSTING.md "Production builder"): a background worker, Docker, NO disk, so it can
  # run 1 to 100 instances (manual scaling on the Settings page; autoscaling needs a Pro workspace). It reaches the web
  # over Render's private network and uploads through the web's hash-checked PUT. Created paused: the owner sets
  # HOMETOWN_WORKER_PAUSED to 0 when the web is ready (HOMETOWN_BUILDER owner and HOMETOWN_BUILD set).
  - type: worker
    name: gamemog-town-builder
    runtime: docker
    # same region as the web: the private network
    region: virginia
    # Pro Plus, 4 CPU / 8 GB: 4 compile slots (1.5 GB each + 0.75 GB for the worker); 2c-4g for a first test. 4c-8g
    # is a valid background-worker plan id on the Blueprint spec page (checked 13 Nov 2026)
    plan: 4c-8g
    numInstances: 1
    dockerfilePath: ./deploy/hometown-compiler.Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    # only the worker's own files rebuild and restart it (a GameMog commit elsewhere never does)
    buildFilter:
      paths:
        - deploy/hometown-compiler.Dockerfile
        - deploy/town-builder/**
    # on a deploy or scale-down: stop claiming, finish and upload the running jobs (worker.py drains on SIGTERM)
    maxShutdownDelaySeconds: 300
    envVars:
      # host:port on Render's private network
      - key: HOMETOWN_WEB
        fromService:
          type: web
          name: gamemog
          property: hostport
      - key: HOMETOWN_WORKER_TOKEN
        fromService:
          type: web
          name: gamemog
          envVarKey: HOMETOWN_WORKER_TOKEN
      - key: HOMETOWN_SLOT_GB
        value: "1.5"
      - key: HOMETOWN_CACHE_GB
        value: "4"
      # "1": claim nothing (a kill switch that needs no deploy of the web); "0" to run. sync: false, so a later
      # Blueprint sync never puts back a value the owner changed on the dashboard: enter "1" when the Blueprint asks
      - key: HOMETOWN_WORKER_PAUSED
        sync: false
