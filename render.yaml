# Render Blueprint for GameMog (docs/DEPLOY-RENDER.md). In the Render dashboard:
# New > Blueprint > GameMog/GameMog. No secret lives in this file: the owner
# enters ADMIN_PASSWORD and ANTHROPIC_API_KEY on the service's Environment page.
# Worlds are test-driven in the creator's browser (lib/test-drive.ts): this
# server has no graphics card and runs no Chrome.
services:
  - type: web
    name: gamemog
    runtime: node
    # Standard, $25 a month: 1 CPU, 2 GB (the owner, 7 Nov, for launch; was
    # Starter 0.5c-512mb). Story worlds' files stream from the disk.
    plan: 1c-2g
    region: virginia
    # next.config.ts builds with one worker, so the build's fresh database is safe
    buildCommand: npm ci && npm run build
    # the first boot on an empty disk copies in deploy/seed.db.gz
    startCommand: node deploy/boot.mjs && node_modules/.bin/next start -p $PORT
    healthCheckPath: /robots.txt
    autoDeployTrigger: commit
    # www.gamemog.com is added and redirected here automatically. DNS is at
    # GoDaddy (docs/DEPLOY-RENDER.md); Render issues and renews the certificate.
    domains:
      - gamemog.com
    # the database and the Story Kit store (data/storykit) live here, and
    # survive deploys; 10 GB (the owner, 7 Nov; was 1 GB), $2.50 a month. The store may use
    # STORYKIT_DISK_MB of it (8,000 by default, guard at 90%). The town
    # builder's queue, tiles, bundles and staged sources (data/hometown) share
    # it under HOMETOWN_DISK_CAP_GB below. Grown on demand, not in advance (the
    # owner, 13 Nov): when the status page shows the store near its cap, change
    # sizeGB to 20 here AND HOMETOWN_DISK_CAP_GB to 8 (+$5 a month; a disk
    # grows, never shrinks).
    disk:
      name: gamemog-data
      mountPath: /opt/render/project/src/data
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Create and Mog it are open (the owner, 30 Sep; ANTHROPIC_API_KEY is on
      # the Environment page). "off" goes back to "Coming soon" and refuses
      # builds (middleware.ts).
      - key: NEXT_PUBLIC_BUILDS
        value: "on"
      # link previews, canonical addresses and the sitemap use the custom domain
      - key: SITE_URL
        value: https://gamemog.com
      - key: ADMIN_PASSWORD
        sync: false
      # Story Kit (lib/storykit-switch.ts): story worlds on Create and their Mogs, for everyone (the owner, 13 Nov: the
      # hometown live test). "owner": the owner's /admin session only; anything else: off. /create is prerendered, so
      # this is read when the site is built (a deploy)
      - key: STORYKIT
        value: "on"
      # Hometown (docs/HOMETOWN.md): Create's town box and /api/places for everyone, built into the page (the server's
      # HOMETOWN_BUILDER below answers the same at run time)
      - key: NEXT_PUBLIC_HOMETOWN_SEARCH
        value: "on"
      # Hometown towns served from this disk (docs/HOMETOWN-HOSTING.md, lib/hometown-tiles/): the tiles, descriptors,
      # build records and bundles Mog City's engine reads. data/hometown may use HOMETOWN_DISK_CAP_GB of the disk, and
      # no put lands while the disk's free space is under HOMETOWN_FREE_FLOOR_GB (2). This server never compiles
      # (HOMETOWN_COMPILE stays off): the builder runs below do.
      - key: HOMETOWN_TILES
        value: "on"
      - key: HOMETOWN_COMPILE
        value: "off"
      # the bearer token for /api/hometown/admin/* (upload, status, GC): entered by the owner on the Environment page,
      # at least 24 characters; unset, the admin routes are not found
      - key: HOMETOWN_ADMIN_TOKEN
        sync: false
      # The production town builder (lib/hometown-build, docs/HOMETOWN-HOSTING.md): the web holds
      # the job queue (data/hometown/queue.db) and the store, and NEVER compiles; runs of the gamemog-town-builder
      # workflow below do. off: the queue is inert and no town route answers from it. owner: every town route, and
      # Create's town box, answer only the owner's /admin session (the production test). on: players (the owner,
      # 13 Nov: "switch the builder on, full visibility to everyone")
      - key: HOMETOWN_BUILDER
        value: "on"
      # the builder runs' bearer token: generated by Render (a random 256-bit value, 44 characters) the first time the
      # Blueprint syncs this key, and never shown to anyone; the workflow reads it from this service (fromService
      # envVarKey). Not sync: false, because a Blueprint update IGNORES new sync: false keys (Render's spec): the token
      # would never exist and every run would fail. A value already on the Environment page is kept (Render generates
      # only a missing one). Unset: /api/hometown/worker is not found
      - key: HOMETOWN_WORKER_TOKEN
        generateValue: true
      # spawn first (compiler 0.7.0+, 0.8.0 pinned by workflow-build.sh: --frame and --assemble): the story starts from the
      # town's frame, and players drive the 5 x 5 spawn district while the rest of the town builds
      - key: HOMETOWN_FRAME
        value: "on"
      # the build new towns are made at: the buildId a run logs at start (the owner's status page shows it). Optional:
      # unset, it is the build the last run reported, and the very first pick (no run ever) starts one run to learn it
      # (that pick is asked to try again in a minute). Set it to pin a build across a compiler upgrade
      - key: HOMETOWN_BUILD
        sync: false
      # the store's share of the 10 GB disk (Story Kit's real use is far under its 8 GB on paper; no put lands under the
      # 2 GB free floor whatever the cap), and the staged Overture regions' own share of it (least recently used go
      # first). With the disk at 20 GB: 8 and 2
      - key: HOMETOWN_DISK_CAP_GB
        value: "4"
      - key: HOMETOWN_SRC_CAP_GB
        value: "1"
      # a new town is refused (busy, with the 3 nearest built towns) when its wait to drive is over this
      - key: HOMETOWN_MAX_WAIT_S
        value: "600"
      - key: HOMETOWN_PER_IP_HOUR
        value: "3"
      # new towns players may ask for in a UTC day (built towns are never limited): THE spend cap of the builder runs,
      # about $0.10 a town alone (docs/HOMETOWN.md, costs), so at most about $10 a day
      - key: HOMETOWN_DAILY_COLD
        value: "100"

      # Builders on demand (the owner, 13 Nov: "upgrade on DEMAND, not anticipation"): no builder is up while there is
      # no work. The web's dispatcher (lib/hometown-build/dispatch.ts) starts runs of the gamemog-town-builder workflow
      # through the Render API when the queue has claimable work; each run builds until the queue is idle for 20 s,
      # then ends (billed per second; idle costs nothing). "off": no run is started (the fastest kill switch).
      # "workflows": on (needs the key and the slug below, and HOMETOWN_BUILDER owner or on)
      - key: HOMETOWN_RUNS
        value: "workflows"
      # a Render API key (Account Settings, API Keys), entered by the owner here only. It starts and reads task runs
      # (POST/GET /v1/task-runs); unset, nothing is started and every new town is refused at once ("towns are not being
      # built right now"), never left waiting. A Blueprint update IGNORES new sync: false keys, so the owner adds this
      # key by hand on the Environment page BEFORE the push that turns the builder on (docs/HOMETOWN-HOSTING.md)
      - key: HOMETOWN_RENDER_API_KEY
        sync: false
      # the workflow's slug: the task the dispatcher starts is <slug>/build_jobs
      - key: HOMETOWN_WORKFLOW_SLUG
        fromService:
          type: workflow
          name: gamemog-town-builder
          property: slug
      # runs in flight at most (each 4c-8g, 4 compile slots, $1.00 an hour while it runs). Hobby starts at most 16 new
      # CPU a minute (4 runs); Render queues the rest
      - key: HOMETOWN_MAX_RUNS
        value: "20"
      - key: HOMETOWN_RUN_SLOTS
        value: "4"
      # while only pre-warm (P5) work is ready, at most this many runs
      - key: HOMETOWN_PREWARM_RUNS
        value: "4"

  # The town builder (docs/HOMETOWN-HOSTING.md): a Render WORKFLOW, not an always-on worker. One
  # task, build_jobs (deploy/town-builder/workflow.py): each run is its own 4c-8g instance, spun up on demand by the
  # web's dispatcher, that claims jobs from the web over Render's private network (same region), uploads through the
  # web's hash-checked PUT, and ends when the queue is idle for 20 s or after 2 h. No disk, no ports. Workflows build on
  # the native runtime only (python or node; no Dockerfile): workflow-build.sh pins Python, the compiler commit, its
  # packages by hash, the OSM table and the duckdb extensions (deploy/hometown-compiler.Dockerfile is the same recipe,
  # kept for reference).
  - type: workflow
    name: gamemog-town-builder
    runtime: python
    # same region as the web: the private network
    region: virginia
    # the SDK into the service's Python; the compiler, its own venv and the data seed into .town-builder (10-15 min:
    # pip by hash, duckdb extensions, the Overture file index)
    buildCommand: pip install -r deploy/town-builder/workflow-requirements.txt && bash deploy/town-builder/workflow-build.sh
    startCommand: python deploy/town-builder/workflow.py
    autoDeployTrigger: commit
    # only the builder's own files rebuild it (a GameMog commit elsewhere never does)
    buildFilter:
      paths:
        - deploy/town-builder/**
    envVars:
      # the Python every build is made with (the compiler lock's wheels are CPython 3.14): part of the buildId
      - key: PYTHON_VERSION
        value: "3.14.6"
      # host:port of the web on Render's private network
      - key: HOMETOWN_WEB
        fromService:
          type: web
          name: gamemog
          property: hostport
      - key: HOMETOWN_WORKER_TOKEN
        fromService:
          type: web
          name: gamemog
          envVarKey: HOMETOWN_WORKER_TOKEN
      # each run's compute plan (read when the task registers, at a deploy): 4 CPU, 8 GB, 4 compile slots
      - key: HOMETOWN_RUN_PLAN
        value: "4c-8g"
      - key: HOMETOWN_SLOT_GB
        value: "1.5"
      - key: HOMETOWN_CACHE_GB
        value: "4"
      # "1": a run claims nothing and ends at once (a kill switch that needs no deploy of the web); "0" or unset builds.
      # sync: false, so a later Blueprint sync never puts back a value the owner changed: to build, enter "0" (or leave it
      # empty) when it asks
      - key: HOMETOWN_WORKER_PAUSED
        sync: false
