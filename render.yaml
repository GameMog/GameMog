# Render Blueprint for GameMog (docs/DEPLOY-RENDER.md). In the Render dashboard:
# New > Blueprint > GameMog/GameMog. No secret lives in this file: the owner
# enters ADMIN_PASSWORD and ANTHROPIC_API_KEY on the service's Environment page.
# Worlds are test-driven in the creator's browser (lib/test-drive.ts): this
# server has no graphics card and runs no Chrome.
services:
  - type: web
    name: gamemog
    runtime: node
    # Standard, $25 a month: 1 CPU, 2 GB (the owner, 7 Nov, for launch; was
    # Starter 0.5c-512mb). Story worlds' files stream from the disk.
    plan: 1c-2g
    region: virginia
    # next.config.ts builds with one worker, so the build's fresh database is safe
    buildCommand: npm ci && npm run build
    # the first boot on an empty disk copies in deploy/seed.db.gz
    startCommand: node deploy/boot.mjs && node_modules/.bin/next start -p $PORT
    healthCheckPath: /robots.txt
    autoDeployTrigger: commit
    # www.gamemog.com is added and redirected here automatically. DNS is at
    # GoDaddy (docs/DEPLOY-RENDER.md); Render issues and renews the certificate.
    domains:
      - gamemog.com
    # the database and the Story Kit store (data/storykit) live here, and
    # survive deploys; 10 GB (the owner, 7 Nov; was 1 GB), $2.50 a month. The
    # store may use STORYKIT_DISK_MB of it (8,000 by default, guard at 90%).
    disk:
      name: gamemog-data
      mountPath: /opt/render/project/src/data
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Create and Mog it are open (the owner, 30 Sep; ANTHROPIC_API_KEY is on
      # the Environment page). "off" goes back to "Coming soon" and refuses
      # builds (middleware.ts).
      - key: NEXT_PUBLIC_BUILDS
        value: "on"
      # link previews, canonical addresses and the sitemap use the custom domain
      - key: SITE_URL
        value: https://gamemog.com
      - key: ADMIN_PASSWORD
        sync: false
      # Hometown towns served from this disk (docs/HOMETOWN-HOSTING.md, lib/hometown-tiles/): off until the owner
      # turns them on. data/hometown may use HOMETOWN_DISK_CAP_GB of the disk (2 by default; Story Kit has 8,000 MB
      # of it on paper, so a 20 GB disk is the proposal before the cap goes up), and no put lands while the disk's free
      # space is under HOMETOWN_FREE_FLOOR_GB (2). This server does not compile: towns are pre-warmed on the Mac
      # and uploaded with the owner's token.
      - key: HOMETOWN_TILES
        value: "off"
      - key: HOMETOWN_COMPILE
        value: "off"
      # the bearer token for /api/hometown/admin/* (upload, status, GC): entered by the owner on the Environment page,
      # at least 24 characters; unset, the admin routes are not found
      - key: HOMETOWN_ADMIN_TOKEN
        sync: false
