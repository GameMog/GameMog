<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mog City: story props</title>
  <style>html, body { margin: 0; height: 100%; background: #15171c; overflow: hidden; } canvas { display: block; }
    #lbl { position: fixed; left: 14px; bottom: 12px; color: #fff; font: 600 15px/1.3 system-ui, sans-serif; text-shadow: 0 1px 3px #000; }</style>
  <script>window.__errs = []; addEventListener('error', (e) => window.__errs.push(String(e.message || e))); addEventListener('unhandledrejection', (e) => window.__errs.push(String(e.reason && e.reason.stack || e.reason)));</script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@bc7d0b3c3838d5da9495b5e603afd77ed3154d57/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@bc7d0b3c3838d5da9495b5e603afd77ed3154d57/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@bc7d0b3c3838d5da9495b5e603afd77ed3154d57/build/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@bc7d0b3c3838d5da9495b5e603afd77ed3154d57/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<div id="lbl"></div>
<script type="module">
// The story props (wagmi/storyrun/props.js) in a studio, turning. ?kind=duck|duffel|duffel-open|sponge|bucket|jacket|
// jacket-folded|suds|slip|all (all: every one in a row), ?a=deg (the turn; else it turns), ?cam=x,y,z&at=x,y,z&fov=,
// ?bg=#hex, ?lod=1 (the flotilla's duck), ?wire=1. window.__ready once drawn; window.__tris the triangle count shown.
import * as THREE from 'three/webgpu';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { makeProp, duckGeometry, duckMaterial, triCount, PROP_KINDS, PROP_SIZE } from '../wagmi/storyrun/props.js';

const q = new URLSearchParams(location.search), kind = q.get('kind') || 'all';
const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
await renderer.init();
const scene = new THREE.Scene(); scene.background = new THREE.Color(q.get('bg') || '#1A1D23');
const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.8;
const key = new THREE.DirectionalLight('#FFF1DE', 2.4); key.position.set(3, 5, 4); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 20 }); scene.add(key);
scene.add(new THREE.HemisphereLight('#BFD4FF', '#3A3027', 0.5));
const floor = new THREE.Mesh(new THREE.CircleGeometry(12, 64), new THREE.MeshStandardMaterial({ color: '#3B3F47', roughness: 0.9 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const kinds = kind === 'all' ? PROP_KINDS : [kind];
const turn = new THREE.Group(); scene.add(turn);
let x = 0, tris = 0, span = 0;
const items = [];
for (const k of kinds) {
  let g;
  if (k === 'duck' && q.get('lod') === '1') { g = new THREE.Group(); const m = new THREE.Mesh(duckGeometry(THREE, { lod: 1 }), duckMaterial(THREE)); m.scale.setScalar(PROP_SIZE.duck); m.castShadow = true; g.add(m); }
  else g = makeProp(THREE, k);
  // (in a row, each scaled up to about the duffel's size so all read in one frame)
  const s = kind === 'all' ? Math.min(3, 0.9 / PROP_SIZE[k]) : 1;
  g.scale.multiplyScalar(s);
  const b = new THREE.Box3().setFromObject(g), w = b.max.x - b.min.x;
  if (kind === 'all') { g.position.x = x + w / 2; x += w + 0.35; }
  turn.add(g); items.push(g);
  g.traverse((o) => { if (o.isMesh) { const n = triCount(o.geometry) * (o.isInstancedMesh ? o.count : 1); tris += n; if (q.get('wire')) o.material.wireframe = true; } });
}
if (kind === 'all') { for (const g of items) g.position.x -= x / 2; }
const bb = new THREE.Box3().setFromObject(turn), size = bb.getSize(new THREE.Vector3()), mid = bb.getCenter(new THREE.Vector3());
span = Math.max(size.x, size.y * 1.6, size.z);
const vec = (k) => (q.get(k) || '').split(',').map(Number);
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 30), innerWidth / innerHeight, 0.01, 100);
const d = span / (2 * Math.tan((cam.fov * Math.PI) / 360)) * 1.25;
if (q.has('cam')) cam.position.fromArray(vec('cam')); else cam.position.set(mid.x, mid.y + d * 0.45, mid.z + d);
cam.lookAt(q.has('at') ? new THREE.Vector3().fromArray(vec('at')) : mid);
document.getElementById('lbl').textContent = `${kinds.join(' · ')}  —  ${Math.round(tris).toLocaleString()} triangles`;
window.__tris = tris;
let t0 = performance.now(), frames = 0;
renderer.setAnimationLoop(() => {
  const a = q.has('a') ? (+q.get('a') * Math.PI) / 180 : ((performance.now() - t0) / 1000) * 0.6;
  if (kind === 'all') { for (const g of items) g.rotation.y = a; } else turn.rotation.y = a;
  renderer.render(scene, cam);
  if (++frames === 4) window.__ready = true;
});
</script>
</body>
</html>
