<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Voices again</title>
<style>
  :root { --bg: #0E0F13; --fg: #ECE8DF; --mute: #9B968C; --line: #2C2D33; --ok: #7FC28B; --bad: #E0776C; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  main { padding: 16px; display: grid; gap: 12px; max-width: 1280px; }
  h1 { font-size: 16px; margin: 0; } #st { color: var(--mute); margin: 0; } #st.bad { color: var(--bad); } #st.ok { color: var(--ok); }
  #stage { width: 100%; height: 72vh; border: 1px solid var(--line); background: #111214; }
  #stage:empty { display: none; }
  #stage iframe { width: 100%; height: 100%; border: 0; }
  ul { margin: 0; padding-left: 20px; } a { color: var(--fg); } .mute { color: var(--mute); }
</style>
</head>
<body>
<main>
  <h1 id="title">Voices again</h1>
  <p id="st">Loading...</p>
  <ul id="list"></ul>
  <div id="stage" aria-label="The voice studio"></div>
</main>
<script type="module" src="./revoice.js"></script>
</body>
</html>
