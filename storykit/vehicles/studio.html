<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story Kit Vehicle Studio</title>
  <style>
    :root { --bg: #c9ccd0; --ink: #1b1d20; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; }
    #info { position: fixed; left: 16px; bottom: 14px; opacity: 0.75; pointer-events: none; }
    #err { position: fixed; left: 16px; top: 14px; color: #8a1010; white-space: pre-wrap; max-width: 80vw; }
    body.night { --bg: #07090c; --ink: #c9ccd0; }
    body.clean #info { display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@bc7d0b3c3838d5da9495b5e603afd77ed3154d57/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@bc7d0b3c3838d5da9495b5e603afd77ed3154d57/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@bc7d0b3c3838d5da9495b5e603afd77ed3154d57/build/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@bc7d0b3c3838d5da9495b5e603afd77ed3154d57/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info"></div>
  <div id="err"></div>
  <script type="module">
    // A turntable for vehicle sheets, outside the city.
    //   ?sheet=<name>       a sheet in sheets/ (trailhand, vandal-gt, roadster, night-cab, work-van, black-sedan, wrecker)
    //   ?door=0..1 the front doors open   ?tow=out,lift the wrecker's wheel-lift   ?beacon=1 its light bar
    //   ?view=34|front|rear|side|top|seat|low   ?night=1   ?brake=1   ?steer=0.6   ?spin=1   ?clean=1
    //   ?lineup=1           every sheet in a row
    import * as THREE from 'three/webgpu';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { buildVehicle } from './build-vehicle.js';

    const SHEETS = ['trailhand', 'vandal-gt', 'roadster', 'night-cab', 'work-van', 'black-sedan', 'wrecker'];
    const q = new URLSearchParams(location.search);
    const view = q.get('view') || '34', night = q.get('night') === '1';
    document.body.classList.toggle('night', night);
    document.body.classList.toggle('clean', q.get('clean') === '1');
    const errBox = document.getElementById('err');
    addEventListener('error', (e) => { errBox.textContent += String(e.message) + '\n'; });
    addEventListener('unhandledrejection', (e) => { errBox.textContent += String(e.reason?.stack || e.reason) + '\n'; });

    const renderer = new THREE.WebGPURenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = night ? 0.9 : 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    await renderer.init();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(night ? '#06080b' : '#c9ccd0');
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = night ? 0.06 : 0.65;
    const floor = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardNodeMaterial({ color: night ? '#0d0f12' : '#b9bcc0', roughness: 0.55 }));
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
    scene.fog = new THREE.Fog(scene.background, 18, 52);
    const key = new THREE.DirectionalLight('#fff6ea', night ? 0.15 : 2.6);
    key.position.set(5, 9, 6); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
    Object.assign(key.shadow.camera, { left: -12, right: 12, top: 8, bottom: -8, near: 1, far: 40 }); key.shadow.bias = -0.0004;
    scene.add(key);
    const rim = new THREE.DirectionalLight('#dfe8ff', night ? 0.25 : 1.1); rim.position.set(-6, 4, -7); scene.add(rim);
    scene.add(new THREE.HemisphereLight(night ? '#1a2333' : '#eef2f6', night ? '#050505' : '#55585c', night ? 0.2 : 0.6));

    const load = async (name) => (await fetch(`./sheets/${name}.json`)).json();
    const cars = [];
    const place = (car, x) => { car.group.position.x = x; car.group.traverse((m) => { if (m.isMesh) { m.castShadow = !m.material.transparent; m.receiveShadow = true; } }); scene.add(car.group); car.setNight?.(night ? 1 : 0); car.setBrake?.(q.get("brake") === "1"); cars.push(car); };
    let label = '';
    if (q.get('lineup') === '1') {
      let x = 0; const built = [];
      for (const n of SHEETS) built.push(buildVehicle(THREE, await load(n)));
      const total = built.reduce((s, c) => s + c.width + 0.9, -0.9);
      x = -total / 2;
      for (const c of built) { place(c, x + c.width / 2); x += c.width + 0.9; }
      label = 'all six sheets';
    } else {
      const name = q.get('sheet') || 'trailhand';
      const car = buildVehicle(THREE, await load(name));
      place(car, 0); label = `${car.label} (${car.sheet.class}, ${car.sheet.era}, ${car.sheet.condition})`;
      window.__car = car;
      if (q.get('door')) for (const k of ['L', 'R']) car.setDoor?.(k, +q.get('door'));
      if (q.get('tow') && car.tow) car.tow.set(...q.get('tow').split(',').map(Number));
      if (q.get('beacon') === '1') car.setBeacon?.(true);
    }
    document.getElementById('info').textContent = `Story Kit vehicle studio · ${label}`;

    const steer = +(q.get('steer') || 0);
    const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200);
    if (q.get('lineup') === '1') scene.fog = new THREE.Fog(scene.background, 40, 90);
    const span = q.get('lineup') === '1' ? 2.6 : 1;
    const VIEWS = {
      34: [[4.8, 1.45, 6.2], [0.0, 0.8, 0.1]], front: [[0.6, 1.2, 8], [0, 0.85, 0]], rear: [[-3.6, 2.0, -6.6], [-0.1, 0.9, -0.6]],
      side: [[9.5, 1.3, 0], [0, 0.85, 0]], top: [[4, 7, 6], [0, 0.8, -0.2]], seat: [[-2.7, 1.72, -1.45], [-0.35, 1.0, -0.95], 34], low: [[3.9, 0.55, 5.6], [0, 0.7, 0.2], 28],
    };
    const [p, t, fov] = q.get('lineup') === '1' ? [[1.6, 1.25, 7.4], [0, 0.8, 0], 34] : VIEWS[view] || VIEWS[34];
    cam.position.set(p[0] * span, p[1] * (span > 1 ? 1.15 : 1), p[2] * span); if (fov) cam.fov = fov; cam.updateProjectionMatrix();
    const controls = new OrbitControls(cam, renderer.domElement); controls.target.set(...t); controls.enableDamping = true; controls.update();
    addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
    const spin = q.get('spin') === '1';
    let last = performance.now(), frames = 0;
    renderer.setAnimationLoop(() => {
      const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
      for (const c of cars) { if (spin) c.group.rotation.y += dt * 0.25; c.update(dt, 0, -steer); }
      controls.update();
      renderer.render(scene, cam);
      if (++frames === 30) document.documentElement.dataset.ready = '1';
    });
  </script>
</body>
</html>
